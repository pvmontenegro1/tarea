version: "3.8"

services:
  mysql-container-new:
    image: mysql:8
    container_name: mysql-container-new
    environment:
      MYSQL_ROOT_PASSWORD: tu_contrasea
      MYSQL_DATABASE: sisdb2025
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p", "tu_contrasea"]
      interval: 10s
      retries: 5

  app:
    build:
      context: .
    container_name: micro-tarea-app
    ports:
      - "8002:8002"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-container-new:3306/sisdb2025
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: tu_contrasea
    depends_on:
      - mysql-container-new
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:
